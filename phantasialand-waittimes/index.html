<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1030" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Phantasialand" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a2778'/%3E%3Cpath d='M20 70 L35 35 L50 60 L62 40 L80 70 Z' fill='%23b48af0'/%3E%3Ccircle cx='70' cy='28' r='8' fill='%23f0685a'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%234a2778'/%3E%3Cpath d='M20 70 L35 35 L50 60 L62 40 L80 70 Z' fill='%23b48af0'/%3E%3Ccircle cx='70' cy='28' r='8' fill='%23f0685a'/%3E%3C/svg%3E" />
<title>Phantasialand Wait Times</title>
<style>
:root {
  --bg: #f4f2fb;
  --surface: #ffffff;
  --text: #1c1530;
  --text-dim: #6b6480;
  --border: #e3ddf5;
  --accent: #6b3fa0;
  --accent-2: #4a2778;
  --green: #1f9d55;
  --green-bg: #e5f7ec;
  --amber: #b4790a;
  --amber-bg: #fbf0dd;
  --red: #c23a2b;
  --red-bg: #fbe6e3;
  --closed: #8b8496;
  --closed-bg: #efedf6;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #150f24;
    --surface: #201933;
    --text: #f1eefb;
    --text-dim: #a79fc2;
    --border: #352a52;
    --accent: #b48af0;
    --accent-2: #8f5fd6;
    --green: #3ecf7e;
    --green-bg: #143724;
    --amber: #e0a733;
    --amber-bg: #3a2c0f;
    --red: #f0685a;
    --red-bg: #3a1714;
    --closed: #837c99;
    --closed-bg: #241d38;
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 100vh;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  color: #fff;
  padding: calc(env(safe-area-inset-top) + 14px) 16px 12px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

#status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.85rem;
  opacity: 0.95;
}

#refresh-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  font-size: 1.1rem;
  line-height: 1;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#refresh-btn:active { transform: scale(0.92); }
#refresh-btn.spinning { animation: spin 0.7s linear; }
@keyframes spin { to { transform: rotate(360deg); } }

#last-updated {
  font-size: 0.72rem;
  opacity: 0.8;
  margin-top: 4px;
}

#controls {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  flex-wrap: wrap;
}

#search {
  flex: 1 1 160px;
  min-width: 0;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.95rem;
}

#sort-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  flex: 0 0 auto;
}

#sort-toggle button {
  border: none;
  background: var(--surface);
  color: var(--text-dim);
  padding: 9px 12px;
  font-size: 0.85rem;
}

#sort-toggle button.active {
  background: var(--accent);
  color: #fff;
}

main { padding: 0 16px 24px; }

#loading, #error {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 12px;
}

#error {
  color: var(--red);
}

.land {
  margin-bottom: 18px;
}

.land h2 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin: 0 0 6px 4px;
}

.ride-list {
  background: var(--surface);
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.ride {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  gap: 10px;
}

.ride + .ride { border-top: 1px solid var(--border); }

.ride-name { font-size: 0.95rem; flex: 1 1 auto; min-width: 0; }

.nav-btn {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  font-size: 0.95rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-btn:active { transform: scale(0.9); }

.wait-badge {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 700;
  white-space: nowrap;
}

.wait-badge.green { color: var(--green); background: var(--green-bg); }
.wait-badge.amber { color: var(--amber); background: var(--amber-bg); }
.wait-badge.red { color: var(--red); background: var(--red-bg); }
.wait-badge.closed { color: var(--closed); background: var(--closed-bg); }

#empty-state {
  text-align: center;
  color: var(--text-dim);
  padding: 30px 12px;
}

footer {
  text-align: center;
  font-size: 0.72rem;
  color: var(--text-dim);
  padding: 8px 16px 20px;
}

footer a { color: var(--accent); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 20;
}

.modal-overlay[hidden] { display: none; }

.modal-card {
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px);
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.modal-header h3 { margin: 0; font-size: 1.05rem; }

#nav-close {
  border: none;
  background: var(--closed-bg);
  color: var(--text);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  font-size: 1rem;
}

.nav-compass {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 10px 0;
}

.nav-arrow {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--green-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  transition: transform 0.2s ease;
}

.nav-stats { font-size: 0.9rem; color: var(--text-dim); }
.nav-stats strong { color: var(--text); font-size: 1.15rem; }

.nav-btn-row {
  display: flex;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}

.nav-action {
  flex: 1 1 auto;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.88rem;
  text-align: center;
  text-decoration: none;
}

.nav-action.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.nav-note {
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 10px;
}

.nav-error { color: var(--red); font-size: 0.85rem; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Phantasialand</h1>
  <div id="status-line">
    <span id="summary">Loading…</span>
    <button id="refresh-btn" aria-label="Refresh now" title="Refresh now">⟳</button>
  </div>
  <div id="last-updated"></div>
</header>

<div id="controls">
  <input id="search" type="search" placeholder="Search a ride…" autocomplete="off" />
  <div id="sort-toggle" role="group" aria-label="Sort order">
    <button data-sort="land" class="active">By area</button>
    <button data-sort="wait">By wait time</button>
  </div>
</div>

<main id="content">
  <div id="loading">Fetching live wait times…</div>
  <div id="error" hidden></div>
  <div id="lands"></div>
</main>

<footer>
  Data from <a href="https://queue-times.com" target="_blank" rel="noopener">queue-times.com</a> · auto-refreshes every 60s
</footer>

<div id="nav-overlay" class="modal-overlay" hidden>
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="nav-ride-name"></h3>
      <button id="nav-close" aria-label="Close">✕</button>
    </div>
    <div id="nav-body"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const PARKS_URL = "https://queue-times.com/parks.json";
  const QUEUE_URL = (id) => `https://queue-times.com/parks/${id}/queue_times.json`;
  const PARK_ID_KEY = "pl_park_id";
  const REFRESH_MS = 60000;

  const els = {
    summary: document.getElementById("summary"),
    lastUpdated: document.getElementById("last-updated"),
    refreshBtn: document.getElementById("refresh-btn"),
    loading: document.getElementById("loading"),
    error: document.getElementById("error"),
    lands: document.getElementById("lands"),
    search: document.getElementById("search"),
    sortToggle: document.getElementById("sort-toggle"),
    navOverlay: document.getElementById("nav-overlay"),
    navRideName: document.getElementById("nav-ride-name"),
    navClose: document.getElementById("nav-close"),
    navBody: document.getElementById("nav-body"),
  };

  let sortMode = "land";
  let lastData = null; // { lands: [{ name, rides: [...] }] }
  let refreshTimer = null;

  const FETCH_TIMEOUT_MS = 8000;

  async function fetchWithTimeout(url, parseText) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: "no-store", signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (parseText) return parseText(await res.text());
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // r.jina.ai proxies any URL and wraps the body in a reader-mode text
  // block ("Title: ...\n\nURL Source: ...\n\nMarkdown Content:\n<body>").
  // Its markdown conversion can also backslash-escape characters that
  // look like markdown syntax (e.g. "is_open" -> "is\_open"), so strip
  // the wrapper and undo that escaping before parsing as JSON.
  function parseJinaResponse(text) {
    const marker = "Markdown Content:";
    const idx = text.indexOf(marker);
    const body = (idx >= 0 ? text.slice(idx + marker.length) : text).trim();
    return JSON.parse(body.replace(/\\([_*\[\]`])/g, "$1"));
  }

  // Loads a URL via a <script> tag and JSONP callback instead of fetch().
  // Script tags were never covered by the fetch-era CORS/same-origin
  // model (this is the original pre-CORS JSONP technique), so they still
  // work in contexts that block fetch/XHR outright — notably pages
  // opened from file://, where some browsers refuse fetch() to any
  // remote host regardless of the target's CORS headers.
  function fetchViaScript(urlTemplate, timeoutMs) {
    return new Promise((resolve, reject) => {
      const cbName = `__plJsonp${Date.now()}${Math.floor(Math.random() * 1e6)}`;
      const script = document.createElement("script");
      let settled = false;
      const timer = setTimeout(() => finish(() => reject(new Error("timed out"))), timeoutMs);
      function finish(action) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        delete window[cbName];
        script.remove();
        action();
      }
      window[cbName] = (payload) => {
        finish(() => {
          try {
            resolve(typeof payload?.contents === "string" ? JSON.parse(payload.contents) : payload);
          } catch (err) {
            reject(err);
          }
        });
      };
      script.onerror = () => finish(() => reject(new Error("script load error")));
      script.src = urlTemplate.replace("__CALLBACK__", cbName);
      document.head.appendChild(script);
    });
  }

  // Ordered by what diagnostics actually showed working: corsproxy.io
  // now requires a paid key for non-localhost use (permanent 403), and
  // thingproxy/jsonp.afeld.me are unreachable outright, so those are
  // dropped. r.jina.ai answered in under a second and is tried right
  // after the direct attempt; allorigins/codetabs are kept as later
  // fallbacks in case a different network reaches them fine.
  async function fetchJson(url) {
    const enc = encodeURIComponent(url);
    const attempts = [
      { label: "direct", type: "fetch", target: url },
      { label: "r.jina.ai", type: "jina", target: `https://r.jina.ai/${url}` },
      { label: "allorigins.win", type: "fetch", target: `https://api.allorigins.win/raw?url=${enc}` },
      { label: "codetabs", type: "fetch", target: `https://api.codetabs.com/v1/proxy?quest=${enc}` },
      { label: "allorigins-jsonp", type: "jsonp", target: `https://api.allorigins.win/get?url=${enc}&callback=__CALLBACK__` },
    ];
    const failures = [];
    for (const attempt of attempts) {
      try {
        if (attempt.type === "fetch") return await fetchWithTimeout(attempt.target);
        if (attempt.type === "jina") return await fetchWithTimeout(attempt.target, parseJinaResponse);
        return await fetchViaScript(attempt.target, FETCH_TIMEOUT_MS);
      } catch (err) {
        const reason = err.name === "AbortError" ? "timed out" : err.message;
        failures.push(`${attempt.label}: ${reason}`);
      }
    }
    throw new Error(`all sources unreachable (${failures.join("; ")})`);
  }

  // Some mobile browsers and file:// / sandboxed preview contexts deny
  // access to localStorage entirely, so fall back to an in-memory map.
  const memoryStore = new Map();
  function readLS(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return memoryStore.has(key) ? memoryStore.get(key) : null;
    }
  }
  function writeLS(key, value) {
    memoryStore.set(key, value);
    try {
      localStorage.setItem(key, value);
    } catch (e) {
      // ignore, memory fallback already set
    }
  }
  function readParkId() {
    return readLS(PARK_ID_KEY);
  }
  function writeParkId(id) {
    writeLS(PARK_ID_KEY, id);
  }

  // Ride coordinates aren't provided by queue-times.com, so instead of
  // guessing GPS positions, each ride's location is calibrated on-site:
  // the first time you're standing near it, tapping "Set my location"
  // saves your current GPS fix under that ride's id for future visits.
  function rideLocKey(rideId) {
    return `pl_loc_${rideId}`;
  }
  function readRideLoc(rideId) {
    const raw = readLS(rideLocKey(rideId));
    if (!raw) return null;
    try {
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }
  function writeRideLoc(rideId, lat, lon) {
    writeLS(rideLocKey(rideId), JSON.stringify({ lat, lon, savedAt: Date.now() }));
  }
  function clearRideLoc(rideId) {
    writeLS(rideLocKey(rideId), "");
    memoryStore.delete(rideLocKey(rideId));
    try {
      localStorage.removeItem(rideLocKey(rideId));
    } catch (e) {
      // ignore
    }
  }

  async function getParkId() {
    const cached = readParkId();
    if (cached) return cached;

    const groups = await fetchJson(PARKS_URL);
    for (const group of groups) {
      for (const park of group.parks || []) {
        if (park.name.toLowerCase().includes("phantasialand")) {
          writeParkId(String(park.id));
          return String(park.id);
        }
      }
    }
    throw new Error("Phantasialand not found in queue-times.com park list");
  }

  function normalize(raw) {
    const lands = (raw.lands || []).map((l) => ({ name: l.name, rides: l.rides || [] }));
    if (raw.rides && raw.rides.length) {
      lands.push({ name: "Other", rides: raw.rides });
    }
    return lands;
  }

  // --- In-park navigation ---------------------------------------------

  const EARTH_RADIUS_M = 6371000;
  const toRad = (deg) => (deg * Math.PI) / 180;

  function haversineMeters(lat1, lon1, lat2, lon2) {
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return EARTH_RADIUS_M * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function bearingDegrees(lat1, lon1, lat2, lon2) {
    const y = Math.sin(toRad(lon2 - lon1)) * Math.cos(toRad(lat2));
    const x =
      Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lon2 - lon1));
    const degrees = (Math.atan2(y, x) * 180) / Math.PI;
    return (degrees + 360) % 360;
  }

  const COMPASS_POINTS = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  function compassLabel(deg) {
    return COMPASS_POINTS[Math.round(deg / 45) % 8];
  }

  function formatDistance(meters) {
    if (meters < 1000) return `${Math.round(meters)} m`;
    return `${(meters / 1000).toFixed(2)} km`;
  }

  let navRideId = null;
  let navRideName = "";
  let navWatchId = null;

  function stopNavWatch() {
    if (navWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(navWatchId);
      navWatchId = null;
    }
  }

  function closeNav() {
    stopNavWatch();
    els.navOverlay.hidden = true;
    navRideId = null;
  }

  function renderNavError(message) {
    els.navBody.innerHTML = `<div class="nav-error"></div>`;
    els.navBody.querySelector(".nav-error").textContent = message;
  }

  function renderCalibratePrompt() {
    els.navBody.innerHTML = "";
    const p = document.createElement("p");
    p.className = "nav-stats";
    p.textContent = `This ride's location hasn't been set yet. Stand near ${navRideName} and tap below to save your current GPS position for it.`;
    const btn = document.createElement("button");
    btn.className = "nav-action primary";
    btn.style.display = "block";
    btn.style.width = "100%";
    btn.style.marginTop = "10px";
    btn.textContent = "Set my location as this ride";
    btn.addEventListener("click", calibrateCurrentRide);
    els.navBody.appendChild(p);
    els.navBody.appendChild(btn);
  }

  function mapsUrl(lat, lon) {
    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;
  }

  function renderNavLive(loc, here) {
    const distance = haversineMeters(here.lat, here.lon, loc.lat, loc.lon);
    const bearing = bearingDegrees(here.lat, here.lon, loc.lat, loc.lon);
    els.navBody.innerHTML = "";

    const compass = document.createElement("div");
    compass.className = "nav-compass";
    const arrow = document.createElement("div");
    arrow.className = "nav-arrow";
    arrow.style.transform = `rotate(${bearing}deg)`;
    arrow.textContent = "↑";
    const stats = document.createElement("div");
    stats.className = "nav-stats";
    stats.innerHTML = `<strong>${formatDistance(distance)}</strong> away · ${Math.round(bearing)}° (${compassLabel(bearing)})`;
    compass.appendChild(arrow);
    compass.appendChild(stats);
    els.navBody.appendChild(compass);

    const note = document.createElement("div");
    note.className = "nav-note";
    note.textContent = "Arrow points toward the ride relative to true North — check your phone's compass to line it up.";
    els.navBody.appendChild(note);

    const actions = document.createElement("div");
    actions.className = "nav-btn-row";
    const openMaps = document.createElement("a");
    openMaps.className = "nav-action primary";
    openMaps.href = mapsUrl(loc.lat, loc.lon);
    openMaps.target = "_blank";
    openMaps.rel = "noopener";
    openMaps.textContent = "Open walking directions";
    const recalibrate = document.createElement("button");
    recalibrate.className = "nav-action";
    recalibrate.textContent = "Recalibrate here";
    recalibrate.addEventListener("click", calibrateCurrentRide);
    actions.appendChild(openMaps);
    actions.appendChild(recalibrate);
    els.navBody.appendChild(actions);
  }

  function startNavWatch(loc) {
    stopNavWatch();
    if (!navigator.geolocation) {
      renderNavError("Geolocation isn't available in this browser.");
      return;
    }
    navWatchId = navigator.geolocation.watchPosition(
      (pos) => renderNavLive(loc, { lat: pos.coords.latitude, lon: pos.coords.longitude }),
      (err) => renderNavError(`Couldn't read your location: ${err.message}`),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
  }

  function calibrateCurrentRide() {
    if (!navigator.geolocation) {
      renderNavError("Geolocation isn't available in this browser.");
      return;
    }
    els.navBody.innerHTML = `<p class="nav-stats">Getting your location…</p>`;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        writeRideLoc(navRideId, pos.coords.latitude, pos.coords.longitude);
        startNavWatch({ lat: pos.coords.latitude, lon: pos.coords.longitude });
      },
      (err) => renderNavError(`Couldn't get your location: ${err.message}. This may require the app to be opened over https — see README.`),
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }

  function openNav(rideId, rideName) {
    navRideId = rideId;
    navRideName = rideName;
    els.navRideName.textContent = rideName;
    els.navOverlay.hidden = false;
    const loc = readRideLoc(rideId);
    if (loc) {
      startNavWatch(loc);
    } else {
      renderCalibratePrompt();
    }
  }

  function waitClass(ride) {
    if (!ride.is_open) return "closed";
    if (ride.wait_time <= 20) return "green";
    if (ride.wait_time <= 45) return "amber";
    return "red";
  }

  function waitLabel(ride) {
    if (!ride.is_open) return "Closed";
    return `${ride.wait_time} min`;
  }

  function render() {
    if (!lastData) return;
    const query = els.search.value.trim().toLowerCase();

    let lands = lastData.map((l) => ({
      name: l.name,
      rides: l.rides.filter((r) => r.name.toLowerCase().includes(query)),
    }));

    if (sortMode === "wait") {
      const all = lands.flatMap((l) => l.rides);
      all.sort((a, b) => {
        if (a.is_open !== b.is_open) return a.is_open ? -1 : 1;
        return (b.wait_time || 0) - (a.wait_time || 0);
      });
      lands = [{ name: "All rides", rides: all }];
    }

    lands = lands.filter((l) => l.rides.length > 0);

    els.lands.innerHTML = "";
    if (lands.length === 0) {
      const div = document.createElement("div");
      div.id = "empty-state";
      div.textContent = "No rides match your search.";
      els.lands.appendChild(div);
    } else {
      for (const land of lands) {
        const section = document.createElement("section");
        section.className = "land";

        const h2 = document.createElement("h2");
        h2.textContent = land.name;
        section.appendChild(h2);

        const list = document.createElement("div");
        list.className = "ride-list";
        for (const ride of land.rides) {
          const row = document.createElement("div");
          row.className = "ride";

          const name = document.createElement("span");
          name.className = "ride-name";
          name.textContent = ride.name;

          const badge = document.createElement("span");
          badge.className = `wait-badge ${waitClass(ride)}`;
          badge.textContent = waitLabel(ride);

          const navBtn = document.createElement("button");
          navBtn.className = "nav-btn";
          navBtn.textContent = "📍";
          navBtn.setAttribute("aria-label", `Navigate to ${ride.name}`);
          navBtn.dataset.rideId = ride.id;
          navBtn.dataset.rideName = ride.name;

          row.appendChild(name);
          row.appendChild(badge);
          row.appendChild(navBtn);
          list.appendChild(row);
        }
        section.appendChild(list);
        els.lands.appendChild(section);
      }
    }

    const allRides = lastData.flatMap((l) => l.rides);
    const openCount = allRides.filter((r) => r.is_open).length;
    els.summary.textContent = `${openCount} open · ${allRides.length - openCount} closed`;
  }

  async function refresh(userTriggered) {
    if (userTriggered) els.refreshBtn.classList.add("spinning");
    try {
      const parkId = await getParkId();
      const raw = await fetchJson(QUEUE_URL(parkId));
      lastData = normalize(raw);
      els.loading.hidden = true;
      els.error.hidden = true;
      els.lastUpdated.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      render();
    } catch (err) {
      if (!lastData) {
        els.loading.hidden = true;
        els.error.hidden = false;
        let message = `Couldn't load wait times: ${err.message}`;
        if (window.location.protocol === "file:") {
          message += " — this can happen when the page is opened as a local file; try hosting it (see README) if this keeps failing.";
        }
        els.error.textContent = message;
      } else {
        els.lastUpdated.textContent = `Last update failed (${new Date().toLocaleTimeString()}), showing cached data`;
      }
    } finally {
      if (userTriggered) {
        setTimeout(() => els.refreshBtn.classList.remove("spinning"), 700);
      }
    }
  }

  function scheduleAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(() => refresh(false), REFRESH_MS);
  }

  els.refreshBtn.addEventListener("click", () => refresh(true));
  els.search.addEventListener("input", render);
  els.sortToggle.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-sort]");
    if (!btn) return;
    sortMode = btn.dataset.sort;
    for (const b of els.sortToggle.querySelectorAll("button")) {
      b.classList.toggle("active", b === btn);
    }
    render();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh(false);
  });

  els.lands.addEventListener("click", (e) => {
    const btn = e.target.closest(".nav-btn");
    if (!btn) return;
    openNav(btn.dataset.rideId, btn.dataset.rideName);
  });
  els.navClose.addEventListener("click", closeNav);
  els.navOverlay.addEventListener("click", (e) => {
    if (e.target === els.navOverlay) closeNav();
  });

  refresh(false);
  scheduleAutoRefresh();
})();
</script>
</body>
</html>
